<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harvest Warden · GrindScape</title>
<style>*{box-sizing:border-box}body{margin:0;background:#15181e;color:#e8dfd1;font:14px system-ui}canvas{display:block}header{position:absolute;left:32px;top:26px;pointer-events:none}h1{margin:6px 0;font:500 30px Georgia}small{letter-spacing:.18em;color:#e7a64d;font-size:10px}p{color:#a4a3a4;line-height:1.6}nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:9px;background:#20232bea;border:1px solid #49414a;border-radius:12px;white-space:nowrap}button{border:0;background:#34313e;color:#eee3d1;padding:11px 15px;border-radius:7px;cursor:pointer}button.active{background:#815d2f}aside{position:absolute;right:28px;top:28px;color:#b9b5ad;text-align:right;font-size:12px;line-height:1.8}#error{color:#ff966f}a{color:#e7a64d}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<header><small>GRINDSCAPE / HALLOWEEN</small><h1>Harvest Warden</h1><p>A coin offering shrine.<br>Drag to orbit · Scroll to zoom</p><p id="error"></p></header>
<aside id="stats">Loading the shrine…</aside>
<nav><button id="hero">Hero</button><button id="game">Game camera</button><button id="back">Rear</button><button id="lod">LOD 0</button><button id="wire">Wireframe</button><button id="night">Night</button></nav>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#20232a');scene.fog=new THREE.Fog('#20232a',22,55);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,2.7,0);controls.maxDistance=25;controls.minDistance=4;controls.maxPolarAngle=Math.PI*.49;
function view(p){camera.position.set(...p);controls.target.set(0,2.7,0);controls.update()}view([8,7,15]);
const amb=new THREE.HemisphereLight(0xbdd0ff,0x433327,1.8);scene.add(amb);const key=new THREE.DirectionalLight(0xffdcac,3.8);key.position.set(-4,9,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:7,bottom:-5});key.shadow.normalBias=.025;scene.add(key);const rim=new THREE.DirectionalLight(0xafaaff,2);rim.position.set(4,6,-4);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x252830,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.035;ground.receiveShadow=true;scene.add(ground);
let models=[],current=0,wire=false,night=false;const loader=new GLTFLoader();
try{for(const file of ['HalloweenOfferingShrine_Web.glb','HalloweenOfferingShrine_LOD1_Web.glb']){const gltf=await loader.loadAsync('./'+file);gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});gltf.scene.visible=models.length===0;models.push(gltf.scene);scene.add(gltf.scene)}updateStats();window.assetInspection={loaded:true,models:models.map(m=>{const b=new THREE.Box3().setFromObject(m);let tris=0,meshes=0;m.traverse(o=>{if(o.isMesh){meshes++;tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3}});return{triangles:tris,meshes,bounds:b.getSize(new THREE.Vector3()).toArray()}})}}catch(e){document.querySelector('#error').textContent=e.message;window.assetInspection={loaded:false,error:e.message}}
function updateStats(){let tris=0,meshes=0;models[current].traverse(o=>{if(o.isMesh){meshes++;tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3}});document.querySelector('#stats').innerHTML=`${Math.round(tris).toLocaleString()} triangles · ${meshes} material batches<br>No textures · No asset lights<br>6.42 m wide · 5.80 m tall`;}
document.querySelector('#hero').onclick=()=>view([8,7,15]);document.querySelector('#game').onclick=()=>view([9,13,12]);document.querySelector('#back').onclick=()=>view([8,7,-15]);
document.querySelector('#lod').onclick=e=>{models[current].visible=false;current=1-current;models[current].visible=true;e.target.textContent='LOD '+current;updateStats()};
document.querySelector('#wire').onclick=e=>{wire=!wire;models.forEach(m=>m.traverse(o=>{if(o.isMesh)o.material.wireframe=wire}));e.target.classList.toggle('active',wire)};
document.querySelector('#night').onclick=e=>{night=!night;amb.intensity=night?.3:1.8;key.intensity=night?.5:3.8;rim.intensity=night?.7:2;e.target.classList.toggle('active',night)};
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></html>
