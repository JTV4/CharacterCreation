<!doctype html><meta charset="utf-8"><title>Alpha hat fit check</title><style>body{margin:0;background:#252b34;color:white;font:15px system-ui}main{display:flex;flex-wrap:wrap}section{width:20%;text-align:center}canvas{width:100%!important;height:auto!important}header{padding:12px}</style><header>Alpha Pass hat fitting — larger hats with visible hair</header><main></main><p id="status">Loading</p><script type="module">
import * as T from 'three';import {setHatHairMask} from '/src/utils/hatHairMask.ts';import fits from '/src/data/alphaHatHair.json';import{GLTFLoader}from'three/examples/jsm/loaders/GLTFLoader.js';
const params=new URLSearchParams(location.search),sex=params.get('sex')||'Female',angle=params.get('angle')||'front';const loader=new GLTFLoader(),names=['Inventioners','Boghop','Shardspire','Wayfinder','Wildplume'];
try{for(const name of names){let section=document.createElement('section');section.textContent=name;document.querySelector('main').append(section);const r=new T.WebGLRenderer({antialias:true});r.setSize(360,500);r.toneMapping=T.ACESFilmicToneMapping;section.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#343b45');scene.add(new T.AmbientLight('white',1));for(const x of [-3,3]){let l=new T.DirectionalLight('white',2);l.position.set(x,3,3);scene.add(l);}const g=(await loader.loadAsync('/equipment/AlphaPass/'+sex+'/'+name+'.glb?v=hair-fit-3')).scene;scene.add(g);const body=(await loader.loadAsync(sex==='Legacy'?'/models/BaseFemaleV3.glb':'/appearance/v6/Models/Base'+sex+'_Appearance.glb')).scene;scene.add(body);const hair=(await loader.loadAsync('/appearance/v6/Models/Hair/'+sex+'_'+(params.get('style')||'ponytail')+'.glb')).scene;hair.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])m.color.set('#503020');});setHatHairMask(hair,fits[sex][name.toLowerCase()],1);scene.add(hair);const box=new T.Box3().setFromObject(g),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());const c=new T.PerspectiveCamera(35,360/500,.01,100);const target=new T.Vector3(0,sex==='Male'?1.73:1.71,0);c.position.copy(target).add(angle==='side'?new T.Vector3(1.3,.04,.05):angle==='back'?new T.Vector3(0,.04,-1.3):new T.Vector3(.09,.04,1.3));c.lookAt(target);r.render(scene,c);}document.querySelector('#status').textContent='Loaded all five hats';}catch(e){document.querySelector('#status').textContent=e.stack;}
</script>
